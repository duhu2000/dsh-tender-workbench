name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'release/**']
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  windows:
    name: Windows / Node 24
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  pr-package:
    name: PR installable package
    if: github.event_name == 'pull_request'
    needs: [linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: mkdir -p .package-output
      - run: npm pack --ignore-scripts --pack-destination .package-output
      - run: sha256sum .package-output/dsh-tender-workbench-*.tgz > .package-output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-tender-workbench-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: .package-output/
          if-no-files-found: error
          retention-days: 7
