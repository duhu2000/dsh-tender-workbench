}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;div id=&quot;dsh-cleaning-mockup&quot;&gt;
  &lt;style&gt;
    #dsh-cleaning-mockup {

            &lt;div class=&quot;dc-compare-card&quot;&gt;&lt;small&gt;企查查标准企业候选&lt;/small&gt;&lt;b id=&quot;dc-candidate-name&quot;&gt;上海星河信息技术有限公司&lt;/b&gt;&lt;p&gt;统一社会信用代码：91310115MA1K4***&lt;br&gt;法定代表人：张某&lt;br&gt;企业状态：存续&lt;/p&gt;&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;dc-section-head&quot;&gt;&lt;h3&gt;匹配证据&lt;/h3&gt;&lt;span class=&quot;dc-chip good&quot;&gt;综合置信度 98%&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;dc-score-grid&quot;&gt;
            &lt;div class=&quot;dc-score-item&quot;&gt;&lt;b&gt;99%&lt;/b&gt;&lt;small&gt;企业名称相似度&lt;/small&gt;&lt;/div&gt;
            &lt;div class=&quot;dc-score-item&quot;&gt;&lt;b&gt;100%&lt;/b&gt;&lt;small&gt;行政区划一致性&lt;/small&gt;&lt;/div&gt;
            &lt;div class=&quot;dc-score-item&quot;&gt;&lt;b&gt;95%&lt;/b&gt;&lt;small&gt;历史信息关联度&lt;/small&gt;&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;footer class=&quot;dc-modal-foot&quot;&gt;
          &lt;button class=&quot;dc-button&quot; id=&quot;dc-reject&quot;&gt;排除该候选&lt;/button&gt;
          &lt;button class=&quot;dc-button primary&quot; id=&quot;dc-confirm&quot;&gt;确认匹配并补全&lt;/button&gt;
        &lt;/footer&gt;
      &lt;/section&gt;
    &lt;/div&gt;

    &lt;div class=&quot;dc-toast&quot; id=&quot;dc-toast&quot; hidden aria-live=&quot;polite&quot;&gt;&lt;i data-lucide=&quot;circle-check&quot;&gt;&lt;/i&gt;&lt;span&gt;操作已完成&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;dsh-cleaning-mockup&#x27;);
      const workbench = root.querySelector(&#x27;.dc-workbench&#x27;);
      const expand = root.querySelector(&#x27;#dc-expand&#x27;);
      const toast = root.querySelector(&#x27;#dc-toast&#x27;);
      let toastTimer;

      const showToast = (message) =&gt; {
        toast.querySelector(&#x27;span&#x27;).textContent = message;
        toast.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() =&gt; { toast.hidden = true; }, 2200);
      };

      const order = [&#x27;upload&#x27;, &#x27;diagnose&#x27;, &#x27;review&#x27;, &#x27;export&#x27;];
      const showStep = (name) =&gt; {
        const activeIndex = order.indexOf(name);
        root.querySelectorAll(&#x27;[data-pane]&#x27;).forEach((pane) =&gt; {
          pane.hidden = pane.dataset.pane !== name;
        });
        root.querySelectorAll(&#x27;.dc-step&#x27;).forEach((step, index) =&gt; {
          step.classList.toggle(&#x27;is-active&#x27;, step.dataset.step === name);
          step.classList.toggle(&#x27;is-complete&#x27;, index &lt; activeIndex);
          step.setAttribute(&#x27;aria-selected&#x27;, step.dataset.step === name ? &#x27;true&#x27; : &#x27;false&#x27;);
          const marker = step.querySelector(&#x27;.dc-step-index&#x27;);
          if (index &lt; activeIndex) marker.innerHTML = &#x27;&lt;i data-lucide=&quot;check&quot; style=&quot;width:13px;height:13px&quot;&gt;&lt;/i&gt;&#x27;;
          else marker.textContent = String(index + 1);
        });
        root.querySelectorAll(&#x27;.dc-capability&#x27;).forEach((button) =&gt; {
          const target = button.dataset.go === &#x27;history&#x27; ? &#x27;&#x27; : button.dataset.go;
          button.classList.toggle(&#x27;is-active&#x27;, target === name || (name === &#x27;export&#x27; &amp;&amp; button.dataset.go === &#x27;export&#x27;));
        });
        if (window.lucide) window.lucide.createIcons({ attrs: { &#x27;stroke-width&#x27;: 1.8 } });
      };

      root.querySelectorAll(&#x27;.dc-step&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; showStep(button.dataset.step)));
      root.querySelectorAll(&#x27;[data-next]&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; showStep(button.dataset.next)));
      root.querySelectorAll(&#x27;.dc-capability&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        if (button.dataset.go === &#x27;history&#x27;) {
          showToast(&#x27;任务历史将在独立页面展示&#x27;);
          return;
        }
        showStep(button.dataset.go);
      }));

      expand.addEventListener(&#x27;click&#x27;, () =&gt; {
        const isExpanded = workbench.classList.toggle(&#x27;is-expanded&#x27;);
        expand.setAttribute(&#x27;aria-pressed&#x27;, isExpanded ? &#x27;true&#x27; : &#x27;false&#x27;);
        expand.setAttribute(&#x27;aria-label&#x27;, isExpanded ? &#x27;收起工作台&#x27; : &#x27;展开工作台&#x27;);
        expand.innerHTML = isExpanded ? &#x27;&lt;i data-lucide=&quot;minimize-2&quot;&gt;&lt;/i&gt;&#x27; : &#x27;&lt;i data-lucide=&quot;maximize-2&quot;&gt;&lt;/i&gt;&#x27;;
        if (window.lucide) window.lucide.createIcons({ attrs: { &#x27;stroke-width&#x27;: 1.8 } });
      });

      root.querySelectorAll(&#x27;.dc-filter&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        root.querySelectorAll(&#x27;.dc-filter&#x27;).forEach((item) =&gt; item.classList.toggle(&#x27;is-active&#x27;, item === button));
        root.querySelectorAll(&#x27;.dc-match-row&#x27;).forEach((row) =&gt; {
          row.hidden = button.dataset.filter !== &#x27;all&#x27; &amp;&amp; row.dataset.kind !== button.dataset.filter;
        });
      }));

      const modal = root.querySelector(&#x27;#dc-modal&#x27;);
      const openModal = (row) =&gt; {
        root.querySelector(&#x27;#dc-source-name&#x27;).textContent = row.querySelector(&#x27;.dc-match-name b&#x27;).textContent;
        root.querySelector(&#x27;#dc-candidate-name&#x27;).textContent = row.dataset.detail;
        modal.hidden = false;
        root.querySelector(&#x27;#dc-modal-close&#x27;).focus();
      };

      root.querySelectorAll(&#x27;.dc-match-row&#x27;).forEach((row) =&gt; {
        row.addEventListener(&#x27;click&#x27;, (event) =&gt; {
          if (event.target.matches(&#x27;input&#x27;)) return;
          openModal(row);
        });
        row.addEventListener(&#x27;keydown&#x27;, (event) =&gt; {
          if (event.key === &#x27;Enter&#x27; || event.key === &#x27; &#x27;) {
            event.preventDefault();
            openModal(row);
          }
        });
      });

      root.querySelector(&#x27;#dc-modal-close&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { modal.hidden = true; });
      modal.addEventListener(&#x27;click&#x27;, (event) =&gt; { if (event.target === modal) modal.hidden = true; });
      root.querySelector(&#x27;#dc-reject&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { modal.hidden = true; showToast(&#x27;候选已排除，记录保留为待核验&#x27;); });
      root.querySelector(&#x27;#dc-confirm&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { modal.hidden = true; showToast(&#x27;已确认匹配并加入补全队列&#x27;); });

      root.querySelector(&#x27;#dc-batch-confirm&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        root.querySelectorAll(&#x27;.dc-match-row[data-kind=&quot;high&quot;] input&#x27;).forEach((checkbox) =&gt; { checkbox.checked = true; });
        showToast(&#x27;已批量确认 408 条高置信度候选&#x27;);
      });

      root.querySelector(&#x27;#dc-export&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        root.querySelector(&#x27;#dc-export-success&#x27;).hidden = false;
        root.querySelector(&#x27;#dc-export-actions&#x27;).hidden = true;
        showToast(&#x27;清洗结果包已生成&#x27;);
      });

      root.querySelector(&#x27;.dc-send&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        const field = root.querySelector(&#x27;.dc-composer textarea&#x27;);
        showToast(field.value.trim() ? &#x27;规则已提交给智能体&#x27; : &#x27;请输入补充规则&#x27;);
        if (field.value.trim()) field.value = &#x27;&#x27;;
      });
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
